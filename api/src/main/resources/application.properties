spring.application.name=Rest Api
server.port=8080
# El backend escucha SOLO en loopback: la unica puerta desde la red es Caddy,
# que ya hace de proxy inverso para toda la API y el WebSocket. Antes escuchaba
# en *:8080, asi que cualquier dispositivo del WiFi podia saltarselo y hablarle
# directo, sin cifrar y sin pasar por sus reglas.
# Verificado antes del cambio: 4 conexiones al 8080, las 4 desde localhost.
server.address=${SERVER_ADDRESS:127.0.0.1}
# Caddy termina el TLS y habla con el backend por http en loopback. Sin esto,
# Spring ve `http` y cree que una peticion de la tablet (origen https://IP) es
# CRUZADA, aunque para el navegador sea el MISMO origen. Ese es el motivo de
# fondo de que haya que mantener listas de origenes en cors.allowed-origins.
# Con la cabecera X-Forwarded-Proto que Caddy ya manda, request.getScheme()
# vuelve a ser `https`, el origen coincide y CORS deja de intervenir.
#
# Confiar en X-Forwarded-* solo es seguro porque NADIE puede hablarle directo
# al 8080: el backend escucha en loopback (ver server.address arriba) y la
# unica puerta desde el WiFi es Caddy, que reescribe esas cabeceras. Si algun
# dia el backend volviera a escuchar en *:8080, cualquiera en la red podria
# mandar `X-Forwarded-Proto: https` a mano y mentir sobre el esquema.
server.forward-headers-strategy=${FORWARD_HEADERS:FRAMEWORK}
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/restaurante?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
# Sin valores por defecto A PROPOSITO: si faltan estas variables la app NO
# arranca, en vez de conectarse en silencio como root. Se definen en
# /etc/restfood/backend.env (produccion), staging.env, o el entorno del CI.
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
# Con Flyway activo, Hibernate NO debe modificar el esquema en prod (evita ALTER destructivos)
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
# `flyway clean` borra TODAS las tablas. No existe motivo para ejecutarlo
# contra el restaurante. El usuario de MySQL tampoco tiene permiso DROP,
# así que son dos cerrojos independientes sobre la misma puerta.
spring.flyway.clean-disabled=true
# Monitoreo (Lección 06): SOLO el endpoint health, y sin detalles.
# Nada de /actuator/env, /beans o /heapdump — esos filtran configuración
# y secretos. El estado global ya incluye la base de datos: si MySQL no
# responde, /actuator/health devuelve DOWN con HTTP 503.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=${HEALTH_DETALLES:never}

api.security.secret=${JWT_SECRET}
springdoc.override-with-generic-response=false

# Orígenes permitidos para CORS/WebSocket (patrón). En prod cambia por tu IP/dominio.
# Van las dos formas de cada patrón, CON y SIN puerto: el navegador manda el
# origen sin puerto cuando es el estándar del esquema (https://IP, no
# https://IP:443), y un patrón terminado en `:*` NO cubre esa forma.
# Ver CorsOrigenesTest — se descubrió con las tablets en https devolviendo 403.
cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://192.168.*.*,https://192.168.*.*,http://192.168.*.*:*,https://192.168.*.*:*}

# Configuración de impresoras — colas CUPS por nombre (Enduro por Ethernet):
#   REPARTIDORES -> socket://192.168.10.20:9100  (zona repartidores: ticket de entrega)
#   COCINA2      -> socket://192.168.10.21:9100  (cocina 2: comandas COCINA_2)
#   MESERAS      -> socket://192.168.10.22:9100  (meseras: ticket final de mesa)
#   COCINA1      -> socket://192.168.10.23:9100  (cocina 1: comandas COCINA_1)
impresora.cocina1.nombre=COCINA1
impresora.cocina2.nombre=COCINA2
impresora.tickets.nombre=REPARTIDORES
impresora.meseras.nombre=MESERAS

# Si se llena impresora.*.ip, ImpresoraService imprime por TCP directo (puerto 9100)
# saltándose CUPS. Se deja vacío a propósito: CUPS da cola/reintentos.
#impresora.cocina1.ip=192.168.10.23
#impresora.cocina2.ip=192.168.10.21
#impresora.tickets.ip=192.168.10.20

# Repartidores cuyo ticket de entrega (PARA LLEVAR) se imprime en COCINA2 en vez de
# la impresora de REPARTIDORES. Nombres tal cual en usuarios.nombre, separados por coma.
impresora.entregas.cocina2.repartidores=SRA.ANGELES