name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      # Solo tests unitarios: RestApiApplicationTests necesita una BD MySQL y el
      # esquema aún no es reproducible desde migraciones (pendiente lección 04)
      - run: ./mvnw -B test -Dtest='!RestApiApplicationTests'
