name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api

    # Base de datos real para el CI. Arranca VACÍA: Flyway la construye desde
    # cero con las migraciones (V0 esquema inicial + V1). Si algún día una
    # migración deja de aplicar limpiamente, el CI lo detecta aquí y no en
    # producción un viernes por la noche.
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: restaurante
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ptest"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # Corre TODOS los tests, incluido RestApiApplicationTests: levanta el
      # contexto completo de Spring contra la base que construyó Flyway.
      # Con ddl-auto=validate, Hibernate compara las entidades contra el
      # esquema — si alguien agrega un campo y olvida la migración, falla aquí.
      - run: ./mvnw -B test
        env:
          DB_URL: jdbc:mysql://127.0.0.1:3306/restaurante?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
          DB_USER: root
          DB_PASSWORD: test
          # Valor de juguete: el contexto solo lo inyecta, no firma nada en los
          # tests. El secreto real vive en /etc/restfood/backend.env del servidor.
          JWT_SECRET: ci-secret-de-prueba-no-usar-en-produccion
